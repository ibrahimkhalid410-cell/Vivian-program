<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2342">
<title>Vivian — 12-Week Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#0A2342; --deep:#081B34; --court:#10325A; --court2:#174170; --line:#2C5D8F;
  --foam:#E2EEF8; --mist:#94B6D4; --tide:#5FA8E8; --ball:#F07F2E; --good:#4FD1A5; --warn:#F2C14E;
  --r1:18px; --r2:12px; --r3:8px;
  --disp:'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body:'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--sea);color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%, #1B4B7E 0%, rgba(27,75,126,0) 60%);
  background-attachment:fixed;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tide);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:14px 14px calc(170px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:.01em;margin:0;line-height:1}
h2{font-size:30px}
h3{font-size:22px}
p{margin:.4em 0}
.muted{color:var(--mist)}
.small{font-size:13.5px}
.sec{margin-top:26px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.panel{background:var(--court);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
.panel + .panel{margin-top:10px}
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:700;background:var(--court2);color:var(--foam);border:1px solid var(--line)}
.btn.primary{background:var(--tide);color:#05182F;border-color:var(--tide)}
.btn.ball{background:var(--ball);color:#1E0E02;border-color:var(--ball)}
.btn.ghost{background:transparent}
.btn.block{width:100%;display:block}
.btn.sm{padding:8px 14px;font-size:14px}
.link{background:none;border:0;color:var(--tide);padding:4px 0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.why{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--mist);background:transparent;color:var(--mist);font-size:12px;font-weight:700;padding:0;vertical-align:middle;margin-left:6px;flex:none}
input[type=number],input[type=text],input[type=date],input[type=url],select,textarea{
  background:var(--deep);border:1px solid var(--line);border-radius:var(--r3);padding:10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13.5px;color:var(--mist);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.chip.on{background:var(--tide);color:#05182F;border-color:var(--tide)}
.faces{display:flex;justify-content:space-between;gap:6px}
.face{flex:1;font-size:26px;padding:8px 0;border-radius:var(--r2);border:1px solid var(--line);background:var(--deep)}
.face.on{background:var(--tide);border-color:var(--tide)}

/* ---------- Player card ---------- */
.stage{perspective:1200px;margin-top:4px}
.pcard{position:relative;width:100%;aspect-ratio:5/6.4;max-height:520px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.pcard.flip{transform:rotateY(180deg)}
.face2{position:absolute;inset:0;border-radius:var(--r1);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:4px}
.face2 .in{position:relative;height:100%;border-radius:calc(var(--r1) - 4px);background:linear-gradient(165deg,#123C69 0%,#0B2747 70%);overflow:hidden;padding:16px 16px 14px;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.t-bronze{background:linear-gradient(135deg,#7A4B2E,#D3976A 40%,#8C5A3C 70%,#E3B48A)}
.t-silver{background:linear-gradient(135deg,#7D8995,#EEF3F7 40%,#9AA7B4 70%,#F6F9FB)}
.t-gold{background:linear-gradient(135deg,#9C7220,#F6DA8A 40%,#B8892B 70%,#FFF1C2)}
.t-diamond{background:linear-gradient(135deg,#3BA9D6,#E9FCFF 40%,#6FD3F5 70%,#FFFFFF)}
.t-opal{background:linear-gradient(135deg,#FF8FB1,#FFE29A,#8FF5D2,#8FB8FF,#E39AFF,#FF8FB1);background-size:300% 300%;animation:opal 6s linear infinite}
@keyframes opal{to{background-position:300% 0}}
.court{position:absolute;inset:0;opacity:.16;pointer-events:none}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;position:relative}
.ovr{font-family:var(--disp);font-weight:900;font-size:76px;line-height:.8}
.ovr small{display:block;font-size:18px;font-weight:800;color:var(--mist);margin-top:6px;letter-spacing:.06em}
.tier{font-family:var(--disp);font-weight:800;font-size:18px;text-align:right}
.tier span{display:block;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--mist);margin-top:2px}
.pname{font-family:var(--disp);font-weight:900;font-size:clamp(68px,22vw,104px);line-height:.8;letter-spacing:.005em;margin:14px 0 4px;position:relative;
  background:linear-gradient(180deg,#FFFFFF 10%,#9FCBF2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ptag{position:relative;font-weight:600;color:var(--mist);font-size:14px}
.rat{position:relative;margin-top:auto;margin-bottom:16px;display:grid;gap:7px}
.rat .r{display:grid;grid-template-columns:122px 30px 1fr;gap:8px;align-items:center;font-size:14px}
.rat .r b{font-family:var(--disp);font-size:22px;font-weight:800;text-align:right}
.rat .lab{font-weight:600;letter-spacing:.02em}
.rat .r{cursor:pointer;border-radius:8px}
.rat .r:active{background:rgba(255,255,255,.06)}
.rq{display:inline-block;font-size:12px;color:var(--ball);margin-left:2px;vertical-align:1px}
.bar{height:7px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--tide),#A9D6FF)}
.flipnote{position:absolute;right:14px;bottom:10px;font-size:11.5px;color:var(--mist)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;overflow:auto}
.bdg{border:1px solid var(--line);border-radius:var(--r2);padding:8px 6px;text-align:center;font-size:12px;line-height:1.2;background:rgba(0,0,0,.15)}
.bdg .ic{font-size:22px;display:block;margin-bottom:3px}
.bdg.off{opacity:.38;filter:grayscale(1)}
.bdg b{display:block;font-size:12.5px}

.lead{margin:16px 2px 0;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.05}
.rot{display:block;color:var(--ball);height:1.1em;overflow:hidden}
.rot span{display:block;animation:rot 12s infinite}
@keyframes rot{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.1em)}50%,70%{transform:translateY(-2.2em)}75%,95%{transform:translateY(-3.3em)}100%{transform:translateY(0)}}
.rot span i{display:block;height:1.1em;font-style:normal}

/* week strip */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wd{border:1px solid var(--line);border-radius:var(--r2);padding:8px 4px;text-align:center;background:var(--court);font-size:12.5px;line-height:1.15}
.wd b{display:block;font-family:var(--disp);font-size:20px;font-weight:800}
.wd.done{background:var(--tide);color:#05182F;border-color:var(--tide)}
.wd.next{border-color:var(--ball);box-shadow:inset 0 0 0 1px var(--ball)}
.phase{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phase h2{font-size:28px}
.prog{height:6px;background:rgba(255,255,255,.08);border-radius:9px;margin:8px 0 12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ball)}

/* session */
.shead{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--sea) 80%,rgba(10,35,66,0));padding:10px 0 12px;margin:-14px 0 4px}
.shead .t{font-family:var(--disp);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.mode{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--court2);border:1px solid var(--line)}
.exc{background:var(--court);border:1px solid var(--line);border-radius:var(--r2);margin-top:10px;overflow:hidden}
.exc.act{border-color:var(--tide);box-shadow:0 0 0 1px var(--tide)}
.exc.fin{opacity:.72}
.exh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;width:100%;text-align:left}
.lbl{font-family:var(--disp);font-weight:800;font-size:20px;min-width:34px;height:34px;border-radius:9px;background:var(--deep);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;padding:0 4px}
.exh .nm{font-weight:700;font-size:16.5px;line-height:1.2}
.exh .st{font-size:13px;color:var(--mist)}
.exb{padding:0 14px 14px}
.fig{width:100%;height:150px;display:block;background:radial-gradient(80% 90% at 50% 100%,#15406E,#0C2A4C);border-radius:var(--r3)}
.figs{width:100%;height:96px}
.cue{font-size:14.5px;margin:8px 0 4px}
.last{font-size:14px;background:var(--deep);border-radius:var(--r3);padding:8px 10px;margin:8px 0}
.last b{color:var(--ball)}
.sets{display:grid;gap:6px;margin-top:8px}
.set{display:grid;grid-template-columns:52px 1fr 1fr 34px;gap:6px;align-items:center}
.set.uni{grid-template-columns:52px 1fr 1fr 1fr 34px}
.set.nw{grid-template-columns:52px 1fr 34px}
.set.nw.uni{grid-template-columns:52px 1fr 1fr 34px}
.set .sn{font-size:13px;color:var(--mist);font-weight:600}
.set input{text-align:center;padding:10px 4px}
.set.on .sn{color:var(--ball)}
.set.on input{border-color:var(--tide)}
.set.dn input{background:transparent;border-color:transparent;color:var(--mist)}
.ok{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--deep);font-size:15px;padding:0}
.set.dn .ok{background:var(--good);border-color:var(--good);color:#04261A}
.colh{display:grid;gap:6px;font-size:11.5px;color:var(--mist);text-align:center}
.exa{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.rir{margin-top:10px;background:var(--deep);border-radius:var(--r3);padding:10px}
.prep li{margin:6px 0}
.prep{list-style:none;padding:0;margin:0}
.pi{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.tick{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--deep);padding:0;font-size:14px}
.tick.on{background:var(--good);border-color:var(--good);color:#04261A}
.test{border:1px dashed var(--ball);border-radius:var(--r2);padding:14px;margin-top:10px;background:rgba(240,127,46,.07)}

/* rest pill */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;
  background:var(--foam);color:#05182F;border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rest .tt{font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums;min-width:52px}
.rest button{border:0;border-radius:999px;background:#05182F;color:var(--foam);padding:8px 14px;font-weight:700}
.hidden{display:none!important}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,27,52,.96);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.tabs .tin{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:480px}
.tabs button{background:none;border:0;color:var(--mist);font-size:12px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--foam)}
.tabs button.on svg{stroke:var(--ball)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,12,25,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--court);border:1px solid var(--line);border-bottom:0;border-radius:var(--r1) var(--r1) 0 0;width:100%;max-width:480px;max-height:88vh;overflow:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s ease-out}

.sheet.na{animation:none}
.btn.dim{opacity:.5}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin-bottom:8px}
.sheet .q{margin-top:16px;font-weight:700}
.sheet .q + *{margin-top:8px}
input[type=range]{width:100%;accent-color:var(--ball)}

/* toast + PR */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--foam);color:#05182F;
  padding:12px 16px;border-radius:var(--r2);max-width:min(440px,calc(100% - 28px));font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:15px}
.toast .from{display:block;font-size:12px;color:#3B5A7A;font-weight:700;margin-bottom:2px}
.pr{position:fixed;inset:0;z-index:80;background:rgba(3,12,25,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.pr h1{font-size:64px;color:var(--ball);font-weight:900}
.pr p{font-size:18px;max-width:320px}
.pr svg{width:150px;height:150px}
.ballf{animation:drop 1.1s cubic-bezier(.5,0,.7,1) both}
@keyframes drop{0%{transform:translate(0,-90px)}60%{transform:translate(0,30px)}75%{transform:translate(0,18px)}100%{transform:translate(0,58px);opacity:0}}

/* tables & charts */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--mist);font-weight:600;font-size:12.5px}
.tblw{overflow-x:auto}
table.lt td,table.lt th{text-align:left;vertical-align:top}
canvas.chart{width:100%;height:170px;display:block}
.stat{font-family:var(--disp);font-weight:800;font-size:34px;line-height:1}
.stat small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--mist);display:block;margin-top:4px}
.mrow{display:grid;grid-template-columns:30px 1fr 96px;gap:10px;align-items:center;margin:8px 0}
.mrow svg{width:30px;height:44px}
.hands{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.hrow .dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:1px dashed var(--mist);background:transparent;font-size:16px;padding:0}
.dot.on{border:1px solid var(--good);background:rgba(79,209,165,.18)}
.prw{display:grid;gap:6px}
.prw div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:14.5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(148,182,212,.25);font-size:15px}
.kv:last-child{border-bottom:0}
.sig{text-align:center;color:var(--mist);font-size:13px;margin-top:30px}
.sig b{font-family:var(--disp);font-size:20px;color:var(--foam);display:block;letter-spacing:.03em}
.gphoto{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:radial-gradient(70% 60% at 50% 45%,#174170,#0B2747);border:1px solid var(--line)}
.gphoto img{width:100%;height:100%;object-fit:cover;display:block}
.gphoto .gempty{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gphoto.empty img{display:none}.gphoto.empty .gempty{display:flex}.gphoto.empty .gcap{display:none}
.gcap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(180deg,rgba(8,27,52,0),rgba(8,27,52,.92));display:flex;flex-direction:column}
.gcap b{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.05}
.mrow2{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;padding:8px 0;cursor:pointer;font-size:14.5px}
.mrow2 b{text-align:right}
.fwrap{border-radius:14px;background:radial-gradient(70% 60% at 50% 45%,#1B4A7C,#0B2747);padding:8px 4px;margin-top:8px}
.fwrap svg{width:100%;height:auto;display:block}
.fpulse{animation:fpulse 1.6s ease-in-out infinite}
@keyframes fpulse{0%,100%{filter:drop-shadow(0 0 0 rgba(246,211,101,0))}50%{filter:drop-shadow(0 0 5px rgba(246,211,101,.95))}}
.fsel{stroke:#fff;stroke-width:1.8}
.flegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--mist)}
.flegend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.sw.pul{background:#F6D365;box-shadow:0 0 6px #F6D365}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav class="tabs" aria-label="Sections"><div class="tin">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Today</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7M7 9.5l5-1 5 1M9 21l3-7 3 7"/></svg>Body</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 21V12M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1-3 4-3 7h3"/></svg>Food</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>More</button>
</div></nav>
<div id="rest" class="rest hidden" role="timer"><span>Rest</span><span class="tt" id="restT">0:00</span><button id="restSkip">Skip</button></div>
<div id="layer"></div>
<script>
'use strict';
/* =====================  CONFIG  ===================== */
const COACH_WA = '201005707565';
const KEY = 'vivian-program-v1';
/* Coach Ibrahim: write a short scouting note here every 2 weeks, then re-upload index.html (same link, her data stays).
   Leave text empty to hide it. */
const SCOUT = {date:'', text:''};
const CLIENT = {name:'Vivian', age:34, height:165, startWeight:77, goal:65, activity:1.5};

/* =====================  EXERCISES  =====================
 pat: animation pattern · inc: kg step · uni: per side · unit: 'r' reps | 's' seconds | 'x' rounds
 bw: no load input · assist: load = machine help (lower is better) */
const EX = {
 squat:{n:'Barbell back squat',pat:'squat',inc:2.5,cue:'Only when the goblet feels light and you feel ready. Brace hard, sit between your hips, drive up through the whole foot.',hint:'Start with the empty bar.'},
 goblet:{n:'Goblet box squat',pat:'goblet',inc:2,cue:'Dumbbell at your chest keeps you upright, so your lower back stays safe. Sit back to a bench, touch it lightly, stand up. Remove the bench when you feel ready.',hint:'Start around 14–16 kg.'},
 legpress:{n:'Leg press',pat:'legpress',inc:5,cue:'Feet high and shoulder-wide. Lower until your hips want to curl, then press. Never lock the knees hard.',hint:'Your old plan: 40 kg × 10.'},
 rdl:{n:'Barbell Romanian deadlift',pat:'hinge',inc:2.5,cue:'Soft knees, push your hips back like closing a car door with your butt. Bar stays on your legs. Feel the hamstrings, keep your back flat.'},
 dbrdl:{n:'Dumbbell RDL',pat:'hinge',inc:2,cue:'Soft knees, push your hips back like closing a car door with your butt. Dumbbells slide down your thighs, back flat, stop when the hamstrings stretch. This is what makes the lower back strong. Kg = per hand.'},
 pullthrough:{n:'Cable pull-through',pat:'hinge',inc:2.5,cue:'Face away from a low cable, rope between your legs. Hips back, then snap them forward. Strong glutes with almost no load on the spine.'},

const WHY = {
 rate:['Why about 1% per week?','In a study on athletes, the group that lost 0.7% of bodyweight per week lost more fat and gained muscle, while the faster group (1.4%) lost less fat. Slightly faster than 0.7% is fine for 12 weeks. Faster than that costs muscle, and muscle is what gives you shape.'],
 kcal:['Where does this number come from?','Mifflin-St Jeor (the most accurate everyday formula) × your activity level, minus about 30%. It updates every time you log a new weight, so it moves with you.'],
 protein:['Why so much protein?','About 2 g per kg of your goal weight. In a deficit, high protein plus heavy lifting is what protects muscle. All of it comes from real food: about 1.5 palms of protein at each of 4 meals.'],
 smart:['How does Smart pick work?','It estimates your 1-rep max from last session (your reps plus the reps you had left) using the standard NSCA table that links % of max to reps, then tells you how many reps the planned weight should give you with about 2 left (RIR 2). Safety rules: only on full sessions, never in a deload week, never on wobbly-ankle days for single-leg work, and the jump is capped at +5% or one weight step. If your reps drop below the range, go back.'],
 musclesnow:['How does Your muscles now work?','Each muscle gets gold from two real things: how much stronger you got on its lifts since your first session (+25% = full), and how much leaner you are (scale trend toward your goal and waist cm, 8 cm = full). Abs, obliques and lower back lean more on the leaner part, because that is what makes them visible. The muscle lines sharpen as you get leaner. Pulsing muscles were worked in your last session. It is a picture of your numbers, not a body scan.'],
 bodymap:['How is muscle progress measured?','Each muscle group is linked to its lifts (glutes: glute bridge and hip thrust, back: pulldown and rows, and so on). It compares your best estimated max now with your first session of this plan. +25% fills the bar, the gain untrained women typically reach in 12 weeks. Calves and ankle also fill with your Ankle rating.'],
 ghost:['What is Ghost Mode?','From week 7, every exercise shows what Block 1 you lifted in the same week of the block. Same plan, same week, six weeks apart: the only person you are racing is you.'],
 countdown:['How is the forecast made?','It draws a line through the help you use on the assisted pull-up across your sessions and shows where that line reaches zero help. Getting leaner moves it closer too. It is a forecast, not a promise, and it updates every Upper B.'],
 clutch:['What is Clutch 30?','For long-meeting days. Short prep, pull-up practice, your main lift and one superset, shorter rests. It counts as a full session, because a short session beats a skipped one every time.'],
 sleep:['Why do we ask about sleep?','In a controlled study, people on the same diet who slept 5.5 h instead of 8.5 h lost 55% less fat and lost more muscle. On short-sleep days the plan keeps you away from max efforts.'],
 pull:['Why pull-up practice every session?','Pull-ups respond to frequency. In one study, women who trained them 3× a week for 3 months mostly still could not do one. So you practise a few minutes almost every session, and getting leaner helps too.'],
 ankle:['Why the ankle work?','Your left ankle is strong, it just has less balance after an old injury. Balance training combined with strength is the best-supported way to fix that. Left goes first, both sides do the same work.'],
 ladder:['What is the balance ladder?','Single-leg moves have 3 levels: hold the rack, fingertips only, then free. The leg gets the same strength work at every level, so you never lose progress while the ankle learns. Climbing the ladder raises your Ankle rating.'],
 back:['Why the floor bridge and goblet first?','A loaded floor bridge keeps your whole back supported, and a goblet squat keeps you upright with light spine load. Same glute and leg results, no fear. The barbell versions wait in Swap for the day you feel ready, your call.'],
 permeal:['Why 4 protein meals?','A review suggests about 0.4 g per kg per meal, spread over at least 4 meals, for the best muscle response. Newer research shows a bigger meal is not wasted either, so the daily total matters most. 4 meals just makes the total easy.'],
 cycle:['Why tag cycle days?','Studies find around 0.5 kg (sometimes more) of water weight around the period, and not in everyone. Tagging those mornings keeps them out of your pace calculation, so water never looks like failure. Training: research finds only a trivial dip in early-period performance, so the plan stays the same and the lighter version is always your choice.'],
 plateau:['How does the plateau check work?','It looks at 3 weeks, not 3 days. Scale down: on track. Scale flat but waist down: fat loss plus muscle, change nothing. Flat for 3 weeks with no cycle days: first check sleep, steps and portions, and only then remove one carb portion. One change at a time.'],
 walk:['Why sea walks and after-meal walks?','In a controlled study a 90-minute walk in nature reduced rumination, a city walk did not. And 2 to 5 minutes of light walking after meals lowers blood sugar compared with sitting. In women, stress going down during a diet was linked to more weight lost.'],
 trend:['Why the 7-day average?','Daily weight swings with water, salt, sleep, stress and your cycle. The average of 7 days shows the real direction. One high morning means nothing.'],
 creatine:['Why creatine?','A 2024 meta-analysis: creatine with lifting added about 1 kg more lean mass and a little less fat than lifting alone. In studies on women it did not raise scale weight much. 3 to 5 g daily, any time.'],
 load:['How is today\'s weight chosen?','Double progression. When you hit the top of the rep range on every set (or had 3+ reps left), the weight goes up. Otherwise you keep the weight and beat your reps.'],
 hands:['Why hand portions?','Your hand grows and shrinks with you, and it travels everywhere. Weigh each food once in week 1 to learn what one portion looks like, then just use your hand.'],

 ratings:['How do ratings work?','Each rating runs from 0 to 100 and is built only from your own numbers, anchored to published research: Strength = how much your main lifts improved (+25% = 100), Pull-up = 4 measured milestones, Ankle = left-leg balance vs the average for your age, Engine = daily steps (10,000 = 100), Consistency = weeks that counted out of 12. OVR is the average of the rated ones. Your best is kept, so it never goes down.'],

/* =====================  TRAINING ENGINE  ===================== */
function repsOf(e,s){return e.uni?Math.min(num(s.l)??0,num(s.rt)??0):(num(s.r)??0)}
function lastFor(id){for(let i=S.sessions.length-1;i>=0;i--){const x=S.sessions[i].ex&&S.sessions[i].ex[id];if(x&&x.s&&x.s.length)return Object.assign({d:S.sessions[i].d},x)}return null}
function unitTxt(e){return e.unit==='s'?'s':e.unit==='x'?' rounds':''}
function setTxt(e,s){const u=unitTxt(e);const reps=e.uni?`${s.l}/${s.rt}${u}`:`${s.r}${u}`;
 if(e.bw)return reps;const w=num(s.w);if(w==null)return reps;return e.assist?`${reps} (help ${w})`:`${w}×${reps}`}
function suggest(id,item){const e=EX[id],last=lastFor(id),n=weekNo();const hint=e.hint?e.hint+' ':'';
 const bs=BASE.find(b=>b.id===id&&b.w!=null);if(!last&&bs&&!e.bw)return{w:bs.start??bs.w,txt:bs.stxt||`Start from your old-plan number (${bs.t}) and adjust so about 2 reps stay in the tank. Beat it and it counts as a PR.`};
 if(!last)return{w:'',txt:hint+(e.bw?'First time: find your number. Stop 1 to 2 reps before your form breaks.':'First time: choose a load that leaves about 2 clean reps in the tank (RIR 2).'),first:1};
 const reps=last.s.map(s=>repsOf(e,s));const lo=item.r[0],hi=item.r[1];
 if(e.bw){const best=Math.max(...reps);return{w:'',txt:isDeload(n)?`Deload week: easy reps, stop well before failure.`:`Best last time: ${best}${unitTxt(e)}. Today: beat it by one, or match it cleaner.`}}
 const ws=last.s.map(s=>num(s.w)).filter(x=>x!=null);if(!ws.length)return{w:'',txt:'Pick your working weight.'};
 const lw=e.assist?Math.min(...ws):Math.max(...ws);
 if(isDeload(n))return{w:e.assist?r05(lw*1.1):r05(lw*.9),txt:'Deload week: about 10% lighter, crisp reps, RIR 3.'};
 const top=reps.every(r=>r>=hi)||(last.rir!=null&&last.rir>=3);
 if(top){const nw=e.assist?Math.max(0,lw-e.inc):lw+e.inc;return{w:nw,up:1,txt:e.assist?`You earned it: ${e.inc} kg less help today.`:`You earned it: +${e.inc} kg today.`}}
 if(reps.every(r=>r<lo)&&last.rir!=null&&last.rir<=0)return{w:lw,txt:'Same weight. Aim for clean reps inside the range before adding more.'};
 return{w:lw,txt:`Same weight. Beat ${reps.join(', ')}${unitTxt(e)}.`}}
function metric(id,sets){const e=EX[id];const done=sets.filter(s=>s.d);if(!done.length)return null;
 if(e.assist){const ok=done.filter(s=>repsOf(e,s)>=1&&num(s.w)!=null);return ok.length?-Math.min(...ok.map(s=>num(s.w))):null}
 if(e.bw||num(done[0].w)==null)return Math.max(...done.map(s=>repsOf(e,s)));
 return Math.max(...done.map(s=>{const w=num(s.w)||0,r=repsOf(e,s);return r>0?w*(1+Math.min(r,12)/30):0}))}
function prText(id,sets){const e=EX[id];const done=sets.filter(s=>s.d);
 if(e.assist){const b=done.reduce((a,s)=>num(s.w)<num(a.w)?s:a);return`${e.n}: only ${b.w} kg of help`}
 if(e.bw)return`${e.n}: ${Math.max(...done.map(s=>repsOf(e,s)))}${unitTxt(e)}`;
 const b=done.reduce((a,s)=>metric(id,[s])>metric(id,[a])?s:a);return`${e.n}: ${setTxt(e,b)}`}


/* Smart pick: RIR-adjusted estimated 1-rep max from last session using the NSCA %1RM-to-reps table (reps done + reps in reserve),
 then the reps she should get today at the planned weight while keeping 2 in reserve (3 on easier days).
 Safety: never raises the planned weight by more than one step, only on full sessions with 3+ reps left last time, never in deload or on wobbly-ankle single-leg work. */
const NSCA=[[1,1],[2,.95],[3,.93],[4,.9],[5,.87],[6,.85],[7,.83],[8,.8],[9,.77],[10,.75],[11,.7],[12,.67],[15,.65],[20,.6]];
function pctFor(r){r=clamp(r,1,20);for(let i=1;i<NSCA.length;i++){const[a,pa]=NSCA[i-1],[b,pb]=NSCA[i];if(r<=b)return pa+(pb-pa)*(r-a)/(b-a)}return .6}
function repsFor(p){if(p>=1)return 1;for(let i=1;i<NSCA.length;i++){const[a,pa]=NSCA[i-1],[b,pb]=NSCA[i];if(p>=pb)return a+(b-a)*(pa-p)/(pa-pb)}return 20}
function smartPick(id,item,mode,ankleSafe){const e=EX[id];if(e.bw||e.assist||!e.inc)return null;const last=lastFor(id);if(!last)return null;
 const ws=last.s.map(z=>num(z.w)).filter(v=>v!=null);if(!ws.length)return null;const rir=last.rir==null?1:last.rir;
 let bestSet=null,e1=0;last.s.forEach(z=>{const w=num(z.w)||0,r=repsOf(e,z);const v=r>0?w/pctFor(r+rir):0;if(v>e1){e1=v;bestSet=z}});if(!e1)return null;
 const lo=item.r[0],hi=item.r[1],tr=(mode==='full'&&!isDeload(weekNo()))?2:3;const dp=suggest(id,item).w;const W=dp===''?Math.max(...ws):dp;
 const reps=w=>Math.floor(repsFor(w/e1))-tr;let R=clamp(reps(W),1,hi+3);
 let up=null;if(mode==='full'&&!isDeload(weekNo())&&!(ankleSafe&&e.uni)&&rir>=3&&reps(W+e.inc)>=hi)up=r05(W+e.inc);
 const from=`${setTxt(e,bestSet)} with ${rir} rep${rir===1?'':'s'} left`;
 let txt=`Estimated max: ${e1.toFixed(1)} kg (from ${from}). At ${W} kg you should get about ${R} reps and still have ${tr} left.`;
 if(R<lo)txt+=` That is below your range, so lower the weight a step if the first set feels heavy.`;else if(R>hi)txt+=` That is above your range: stop at ${hi} clean reps and log RIR honestly.`;
 if(up)txt+=` You also have room for ${up} kg × ${hi}: one step, inside the safe limit.`;
 return{w:up,txt}}
function gateOpen(){return(S.best.rat.ANKLE||0)>=50||weekNo()>=5}
function resolveId(day,i,it,ankleSafe){let id=S.swaps[day+':'+i]||it.id;if(!EX[id])id=it.id;if(it.gate&&!gateOpen())id='balance';if(ankleSafe&&it.ankle)id=it.ankle;return id}
function buildSession(day,mode,ankleSafe){const n=weekNo(),items=DAYS[day].items;
 let list=items.map((it,i)=>{let sets=it.sets;if(it.main&&extraSet(n))sets++;if(isDeload(n)&&it.g!=='P')sets=Math.max(2,sets-1);if(mode==='light')sets=Math.max(2,sets-1);
  return{k:i,g:it.g,id:resolveId(day,i,it,ankleSafe),sets,r:it.r,main:!!it.main,rest:it.rest||75}});
 if(mode==='clutch'){const keep=[];const P=list.find(x=>x.g==='P');if(P)keep.push(Object.assign(P,{sets:2}));
  list.filter(x=>x.g==='1').forEach(x=>keep.push(Object.assign(x,{sets:Math.min(x.sets,3)})));list.filter(x=>x.g==='2').forEach(x=>keep.push(Object.assign(x,{sets:2})));list=keep}
 if(mode==='express'){const keep=[];const P=list.find(x=>x.g==='P');if(P)keep.push(Object.assign(P,{sets:2}));
  const g1=list.find(x=>x.g==='1');if(g1)keep.push(Object.assign(g1,{sets:Math.min(g1.sets,3)}));
  const g2=list.find(x=>x.g==='2');if(g2)keep.push(Object.assign(g2,{sets:2}));list=keep}
 // labels
 const groups=[];list.forEach(x=>{if(!groups.includes(x.g))groups.push(x.g)});let L=0;const lab={};
 groups.forEach(g=>{if(g!=='P')lab[g]=String.fromCharCode(65+L++)});
 groups.forEach(g=>{const m=list.filter(x=>x.g===g);m.forEach((x,j)=>{x.lab=g==='P'?'PU':(m.length>1?lab[g]+(j+1):lab[g])})});
 const steps=[];groups.forEach(g=>{const m=list.filter(x=>x.g===g);
  if(g==='P'||m.length===1)m.forEach(x=>{for(let s=0;s<x.sets;s++)steps.push({k:x.k,i:s,g,rd:s})});
  else{const mx=Math.max(...m.map(x=>x.sets));for(let s=0;s<mx;s++)m.forEach(x=>{if(s<x.sets)steps.push({k:x.k,i:s,g,rd:s})})}});
 return{list,steps}}

function testBest(type,f){const xs=S.tests.filter(t=>t.type===type).map(t=>num(t[f])).filter(x=>x!=null);return xs.length?Math.max(...xs):null}
function latestTest(type){const xs=S.tests.filter(t=>t.type===type);return xs.length?xs[xs.length-1]:null}
function avgSteps(){const xs=[];for(let i=0;i<7;i++){const v=num(S.steps[addDays(today(),-i)]);if(v!=null)xs.push(v)}return xs.length?xs.reduce((a,b)=>a+b)/xs.length:null}
/* Ratings v2: 0–100, built only from her measured numbers, each anchored to a published reference.
 null = not rated yet (no data). STR: +25% on main lifts = 100 (12-week gains in untrained women ~25–30%, Pedersen 2022).
 PULL: 4 measured milestones x 25. ANKLE: left-leg eyes-closed balance, 50 = average woman 18–39 (13.1 s, Springer 2007), 100 = 30 s and even with right.
 ENGINE: best 7-day step average, 100 = 10,000 (benefit plateaus at 8–10k under 60, Paluch 2022). CONS: weeks that counted out of 12. */
const RV=2,STR_IDS=['goblet','bbbridge','pulldown','ohp'];
function firstMetric(id){const s=S.sessions.find(z=>z.ex[id]);return s?metric(id,s.ex[id].s.map(z=>Object.assign({d:1},z))):null}
function bestSessMetric(id){let b=null;S.sessions.forEach(s=>{if(!s.ex[id])return;const v=metric(id,s.ex[id].s.map(z=>Object.assign({d:1},z)));if(v!=null&&(b==null||v>b))b=v});return b}
function bestStepsWeek(){let best=null;const ds=Object.keys(S.steps).sort();ds.forEach(d=>{const v=[];for(let i=0;i<7;i++){const x=num(S.steps[addDays(d,-i)]);if(x!=null)v.push(x)}if(v.length>=3){const a=v.reduce((p,q)=>p+q)/v.length;if(best==null||a>best)best=a}});return best}
function calc(){const bw=latestW(),out={},det={};
 const g=[];STR_IDS.forEach(id=>{const f=firstMetric(id),b=bestSessMetric(id);if(f&&b!=null){const pct=(b-f)/f;g.push(pct);det[id]=[f,b,pct]}});
 out.STR=g.length?clamp(g.reduce((a,b)=>a+b)/g.length/.25*100,0,100):null;det.STR=g;
 const hang=Math.max(testBest('hang','sec')||0,bestSessMetric('hang')||0),negs=testBest('negs','reps')||0,pu=testBest('pullup','reps')||0;
 const as=S.sessions.filter(s=>s.ex.assisted).map(s=>Math.min(...s.ex.assisted.s.map(z=>num(z.w)).filter(v=>v!=null)));
 let ap=null;if(as.length){const first=as[0],bestA=Math.min(...as),goal=.2*bw;ap=first<=goal?1:clamp((first-bestA)/(first-goal),0,1)}
 const anyPull=hang||negs||as.length||S.tests.some(t=>t.type==='pullup');
 out.PULL=anyPull?(pu>=1?100:Math.min(hang,30)/30*25+Math.min(negs,5)/5*25+(ap||0)*25):null;det.PULL={hang,negs,ap,pu,assist:as.length?Math.min(...as):null};
 const bt=latestTest('balance');if(bt){const l=num(bt.l)||0,r=num(bt.r)||0;const lp=l<=13.1?l/13.1*50:50+Math.min((l-13.1)/(30-13.1),1)*35;const sym=r?Math.min(l/r,1):1;out.ANKLE=clamp(lp+sym*15,0,100);det.ANKLE={l,r}}else out.ANKLE=null;
 const sw=bestStepsWeek();out.ENGINE=sw!=null?clamp(sw/10000*100,0,100):null;det.ENGINE=sw;
 out.CONS=S.sessions.length?clamp(countedWeeks()/12*100,0,100):null;
 out.pu=pu;out.det=det;return out}

const SYNC_KEYS=['start','profile','sessions','weights','measures','tests','steps','hands','daily','best','prs','swaps','lad','badges','song','goalTxt','ovr0','rv'];
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

 if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(raw);w.close();return'z1.'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}catch(e){}}return'j1.'+b64u(raw)}
async function unpackData(code){const[tag,body]=[code.slice(0,3),code.slice(3)];let bytes=unb64u(body);
 if(tag==='z1.'){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}else if(tag!=='j1.')throw new Error('bad');return JSON.parse(new TextDecoder().decode(bytes))}

 case'usepick':{const L=S.live;L.log[k].sets.forEach(z=>{if(!z.d)z.w=b.dataset.w});save();renderSession();toast('Set to '+b.dataset.w+' kg. Own it.','Coach Ibrahim');break}
 case'fig':if(b.closest('#fnow')){FSEL=FSEL===b.dataset.m?null:b.dataset.m;$('#fnow').innerHTML=musclesNowHTML()}else toast(MUSC[b.dataset.m]);break;
 case'mworks':{const id=b.dataset.id;sheet(`<h3>${esc(EX[id].n)}</h3><div class="fwrap">${figSVG({pri:EXM[id][0],sec:EXM[id][1],lean:leanness()})}</div><div class="flegend small"><span><i class="sw" style="background:#FF7A1A"></i>Main: ${EXM[id][0].map(m=>MUSC[m]).join(', ')}</span>${EXM[id][1].length?`<span><i class="sw" style="background:#FFB877"></i>Helpers: ${EXM[id][1].map(m=>MUSC[m]).join(', ')}</span>`:''}</div><button class="btn block" style="margin-top:12px" data-act="close">Back to the set</button>`);break}

 case'goaltxt':sheet(`<h3>Caption</h3><p class="small muted">A few words under your goal photo.</p><input type="text" id="gtxt" maxlength="60" value="${esc(S.goalTxt||'Strong, lean, padel-ready.')}"><button class="btn primary block" style="margin-top:12px" data-act="goalsave">Save</button>`);break;
 case'goalsave':S.goalTxt=$('#gtxt').value.trim().slice(0,60);save();closeSheet();$('#gwrap').innerHTML=goalPhotoHTML();break;
 case'syncyes':{const a=mergeData(window.__pkg.data||{});history.replaceState(null,'',pageURL());closeSheet();TAB='today';renderTab();toast(`Updated: ${a.sessions} new session${a.sessions===1?'':'s'}, ${a.weights} weigh-in${a.weights===1?'':'s'}, ${a.tests} test${a.tests===1?'':'s'}.`,S.coach?'Sync':'Coach Ibrahim');break}

 case'savestart':{const v=$('#start').value;if(v){S.start=v;save();toast('Start date saved.')}break}
 case'backup':copyText(backupCode()).then(()=>toast('Backup code copied. Keep it in your notes or send it to yourself.'));break;
 case'restore':{const v=$('#restore').value.trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(v.replace(/^VIV1:/,'')))));if(!o||!Array.isArray(o.sessions))throw 0;S=Object.assign(fresh(),o);save();TAB='today';renderTab();toast('Restored.')}catch(err){toast('That code did not work. Copy the whole code and try again.')}break}

 const x=L.list.find(y=>y.k===k),ex=EX[x.id];if(s.d)return;
 if(f!=='w'&&setFilled(ex,s)){completeSet(k,i);return}
 if(f==='l'){const r=t.parentElement.querySelector('[data-f="rt"]');r&&r.focus()}

function openSwap(k){const L=S.live,x=L.list.find(y=>y.k===k),item=DAYS[L.day].items[k];const opts=[item.id].concat(item.alt||[]);
 sheet(`<h3>Swap exercise</h3><p class="small muted">Machine busy or something feels off? Pick one. The page remembers your choice for next time.</p>
 ${opts.map(id=>`<button class="btn block ${id===x.id?'primary':''}" style="margin-top:8px;text-align:left" data-act="doswap" data-k="${k}" data-id="${id}">${esc(EX[id].n)}${id===item.id?' (plan)':''}</button>`).join('')}`)}
function doSwap(k,id){const L=S.live,item=DAYS[L.day].items[k];if(id===item.id)delete S.swaps[L.day+':'+k];else S.swaps[L.day+':'+k]=id;
 const x=L.list.find(y=>y.k===k);x.id=id;const sg=suggest(id,x);L.log[k].sets.forEach((s,i)=>{s.w=i===0&&sg.w!==''?String(sg.w):''});save();closeSheet();renderSession()}

/* =====================  FIGURE ENGINE  =====================
 Original forward-kinematics stick figure: keyframes of joint angles, eased, grounded automatically. */
const RAD=Math.PI/180,LEN={t:30,th:22,sh:22,ua:16,fa:15,ft:7};
const ease=x=>.5-.5*Math.cos(Math.PI*x);
function poseAt(P,ph){let e;if(P.tempo){const[a,b]=P.tempo;e=ph<a?ease(ph/a):1-ease((ph-a)/b)}else e=ease(ph<.5?ph*2:2-ph*2);
 const[A,B]=P.k;const out=A.map((v,i)=>i<13?v+(B[i]-v)*e:v);let ga=A[13],gb=B[13];
 if(ga===0||gb===0)out[13]=0;else{ga=ga===1?104:ga;gb=gb===1?104:gb;out[13]=ga+(gb-ga)*e}return out}
function joints(p,front){const[hx,hy,t,tF,sF,tB,sB,uF,fF,uB,fB,ftF,ftB,g]=p;const L=dir=>[Math.sin(dir*RAD),Math.cos(dir*RAD)];
 const add=(a,d,l)=>[a[0]+d[0]*l,a[1]+d[1]*l];const tor=[Math.sin(t*RAD),-Math.cos(t*RAD)];
 const hip=[hx,g===0?hy:0];const hF=front?[hip[0]+5,hip[1]]:hip,hB=front?[hip[0]-5,hip[1]]:hip;
 const neck=add(hip,tor,LEN.t),head=add(hip,tor,LEN.t+11);const sFp=front?[neck[0]+8,neck[1]+2]:neck,sBp=front?[neck[0]-8,neck[1]+2]:neck;
 const kF=add(hF,L(tF),LEN.th),aF=add(kF,L(sF),LEN.sh),kB=add(hB,L(tB),LEN.th),aB=add(kB,L(sB),LEN.sh);
 const toe=(a,ang,s)=>front?[a[0]+3*s,a[1]+1]:[a[0]+Math.cos(ang*RAD)*LEN.ft,a[1]+Math.sin(ang*RAD)*LEN.ft];
 const tF_=toe(aF,ftF,1),tB_=toe(aB,ftB,-1);const eF=add(sFp,L(uF),LEN.ua),wF=add(eF,L(fF),LEN.fa),eB=add(sBp,L(uB),LEN.ua),wB=add(eB,L(fB),LEN.fa);
 const J={hip,hF,hB,neck,head,sF:sFp,sB:sBp,kF,aF,kB,aB,tF:tF_,tB:tB_,eF,wF,eB,wB};
 if(g!==0){const ys=Object.entries(J).filter(([k])=>k!=='head').map(([,v])=>v[1]);const dy=g-Math.max(...ys);new Set(Object.values(J)).forEach(v=>v[1]+=dy)}return J}
function drawFig(c,patName,ph){const P=PAT[patName]||PAT.stand,front=P.v==='f';const x=c.getContext('2d'),W=c.width,H=c.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
 const s=Math.min(W/200,H/116);x.setTransform(s,0,0,s,(W-200*s)/2,(H-116*s)/2+2*s);const J=joints(poseAt(P,ph),front);
 const ln=(a,b,w,col)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()};
 x.lineCap='round';x.lineJoin='round';ln([12,104],[188,104],1.5,'rgba(148,182,212,.35)');
 const PROP='rgba(148,182,212,.28)',BALL='#F07F2E';
 const props=P.pr||[];
 props.forEach(p=>{const t=p[0];x.fillStyle=PROP;x.strokeStyle='rgba(148,182,212,.55)';
  if(t==='rect'){x.fillRect(p[1],p[2],p[3],p[4])}
  else if(t==='line')ln([p[1],p[2]],[p[3],p[4]],p[5],'rgba(148,182,212,.45)');
  else if(t==='wall')ln([p[1],20],[p[1],104],4,'rgba(148,182,212,.45)');
  else if(t==='pullbar')ln([60,13],[140,13],4,'rgba(226,238,248,.8)');
  else if(t==='benchB'){const b=J.tB;x.fillRect(b[0]-16,b[1]+2,26,104-b[1]-2)}
  else if(t==='seatHip'){x.fillRect(J.hip[0]-15,J.hip[1]+4,28,5);ln([J.hip[0],J.hip[1]+9],[J.hip[0],104],3,'rgba(148,182,212,.45)')}
  else if(t==='pad'){const d=[J.neck[0]-J.hip[0],J.neck[1]-J.hip[1]],l=Math.hypot(d[0],d[1]),nx=-d[1]/l*7*p[1],ny=d[0]/l*7*p[1];ln([J.hip[0]+nx,J.hip[1]+ny],[J.neck[0]+nx,J.neck[1]+ny],7,'rgba(148,182,212,.35)')}
  else if(t==='plat'){const d=[J.aF[0]-J.kF[0],J.aF[1]-J.kF[1]],l=Math.hypot(d[0],d[1]),nx=-d[1]/l*14,ny=d[0]/l*14,b=J.tF;ln([b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],4,'rgba(148,182,212,.6)')}});
 const back='rgba(148,182,212,.5)',fg='#E2EEF8',w=4.2;
 ln(J.hB,J.kB,w,back);ln(J.kB,J.aB,w,back);ln(J.aB,J.tB,w-1,back);ln(J.sB,J.eB,w,back);ln(J.eB,J.wB,w,back);
 if(front){ln(J.hB,J.hF,w,fg);ln(J.sB,J.sF,w,fg)}ln(J.hip,J.neck,w+.6,fg);
 ln(J.hF,J.kF,w,fg);ln(J.kF,J.aF,w,fg);ln(J.aF,J.tF,w-1,fg);ln(J.sF,J.eF,w,fg);ln(J.eF,J.wF,w,fg);
 x.fillStyle=fg;x.beginPath();x.arc(J.head[0],J.head[1],6.5,0,7);x.fill();
 props.forEach(p=>{const t=p[0];x.fillStyle=BALL;
  const db=h=>{x.fillRect(h[0]-5,h[1]-3,10,6)};
  if(t==='db'){db(J.wF);db(J.wB)}else if(t==='dbF')db(J.wF);else if(t==='dbHip')db([J.hip[0],J.hip[1]-5]);
  else if(t==='plateNeck'||t==='plateF'||t==='plateHip'){const q=t==='plateNeck'?J.neck:t==='plateF'?J.wF:[J.hip[0],J.hip[1]-6];x.beginPath();x.arc(q[0],q[1],8,0,7);x.fill();x.fillStyle='#0B2747';x.beginPath();x.arc(q[0],q[1],2,0,7);x.fill()}
  else if(t==='barHands'){ln([J.wB[0]-6,J.wB[1]],[J.wF[0]+6,J.wF[1]],3,BALL)}
  else if(t==='cable'){const h=p[3]==='mid'?[(J.wF[0]+J.wB[0])/2,(J.wF[1]+J.wB[1])/2]:J.wF;ln(h,[p[1],p[2]],1.4,'rgba(148,182,212,.8)')}})}
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;let animOn=false;
function setupCanvases(){const cs=document.querySelectorAll('canvas[data-pat]');const dpr=Math.min(2,window.devicePixelRatio||1);
 cs.forEach(c=>{c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;drawFig(c,c.dataset.pat,.5)});
 if(!RM&&cs.length&&!animOn){animOn=true;requestAnimationFrame(loop)}}
function loop(ts){const cs=document.querySelectorAll('canvas[data-pat]');if(!cs.length){animOn=false;return}
 cs.forEach(c=>{if(!c.offsetParent)return;const r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const P=PAT[c.dataset.pat];const per=P&&P.tempo?4200:2600;drawFig(c,c.dataset.pat,(ts%per)/per)});
 requestAnimationFrame(loop)}
window.addEventListener('resize',()=>setupCanvases());
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'){setupCanvases();if(e.target.id==='e1d'&&e.target.open)drawE1()}},true);

load();{const r=ratings();if(S.ovr0==null&&r.ovr!=null)S.ovr0=r.ovr}save();renderTab();checkIncoming();window.addEventListener('hashchange',checkIncoming);
